name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Bastion.slnx
      - name: Create a fresh database with Compose and apply all migrations
        run: |
          export DB_POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export DB_OWNER_PASSWORD="$(openssl rand -hex 24)"
          export DB_APP_PASSWORD="$(openssl rand -hex 24)"
          docker compose up --detach --wait db
          docker compose run --rm migrate
      - run: dotnet test Bastion.slnx --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: dotnet build src/Host/Bastion.Host
      - run: npm ci
      - run: npm run api
      - name: Generated API files are committed
        run: |
          git diff --exit-code -- src/Web/Shared/api || {
            echo "::error::OpenAPI document or schema.ts is out of date. Run 'dotnet build' and 'npm run api', then commit both."
            exit 1
          }

  # Pull requests only check that the image builds. A push to master publishes it, tagged with the
  # commit, so the server runs exactly the image of the commit it has checked out (deploy/compose.sh).
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/bastion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
