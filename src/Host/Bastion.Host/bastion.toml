[Logs]
Path = "/data/logs"

[Serilog.MinimumLevel]
Default = "Information"

[Serilog.MinimumLevel.Override]
"Microsoft.AspNetCore" = "Warning"
"System.Net.Http.HttpClient" = "Warning"
"Npgsql" = "Warning"   # otherwise every SQL command is logged

[Modules.Housing]
Enabled = true

[Modules.Housing.OtoDom]
BaseUrl = "https://www.otodom.pl"
ListingUrl = "https://www.otodom.pl/pl/wyniki/wynajem/mieszkanie/cala-polska?by=LATEST&direction=DESC&limit=72"

[Modules.Housing.Import]
MaxPages = 5             # new offers; 72 offers per page
FullScanMaxPages = 1000  # safety limit only; the whole listing had 360 pages in November 2026

[Modules.Housing.RawCaptures]
Path = "/data/raw/housing"
RetentionDays = 30
AnonymizationMask = "***"

[Modules.Housing.Jobs.ImportOffers]
Every = "00:10:00"

[Modules.Housing.Jobs.ScanOffers]
DailyAt = "01:00"   # about 40 minutes, done before the database backup at 03:00

[Modules.Housing.Jobs.RawCaptureRetention]
DailyAt = "04:00"   # after the database backup at 03:00

[Jobs]
TimeZone = "Europe/Warsaw"

[Scraping]
RequireVpn = true
VpnInterfacePrefixes = "wg,tun,proton"
MinDelaySeconds = 3
MaxDelaySeconds = 6
TimeoutSeconds = 30
RobotsCacheHours = 24

[Modules.JobOffers]
Enabled = false
