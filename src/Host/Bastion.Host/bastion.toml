[Serilog.MinimumLevel]
Default = "Information"

[Serilog.MinimumLevel.Override]
"Microsoft.AspNetCore" = "Warning"
"System.Net.Http.HttpClient" = "Warning"
"Npgsql" = "Warning"   # otherwise every SQL command is logged

[Modules.Housing]
Enabled = true

[Modules.Housing.OtoDom]
BaseUrl = "https://www.otodom.pl"
ListingUrl = "https://www.otodom.pl/pl/wyniki/wynajem/mieszkanie/cala-polska?by=LATEST&direction=DESC&limit=72"

[Modules.Housing.Import]
MaxPages = 5             # new offers; 72 offers per page
FullScanMaxPages = 1000  # safety limit only; the whole listing had 360 pages in November 2026

# FetchDetails fetches detail pages of new and changed offers, newest first: 5.2 s each at 3-6 s
# between requests (about 575 per 50-minute run), expected about 4.2 s at 2-5 s. The first runs
# work through the whole backlog (about 26 000 offers).
[Modules.Housing.Details]
MaxMinutes = 55          # per run, which starts every hour; the rest waits for the next run
MaxFailedAttempts = 3    # then the offer waits until its content changes or RetryAfterHours pass
RetryAfterHours = 24     # one more attempt per day: the portal may answer 404 or 410 only for a while
Retries = 4              # when the portal is out of reach (timeout, network, VPN; not 429): wait 30 s, 1, 2, 4 min
FirstRetrySeconds = 30

# Path is set per environment (bastion.<Environment>.toml).
[Modules.Housing.RawCaptures]
RetentionDays = 30
AnonymizationMask = "***"

[Modules.Housing.Wikidata]
QueryUrl = "https://query.wikidata.org/sparql"
UserAgent = "Bastion/1.0"
TimeoutSeconds = 180

# The smallest population of each place size; villages and towns have their own scales.
# Below Village.Medium a village is small; below Town.Small a town is very small.
[Modules.Housing.PlaceSizes.Village]
Medium = 200
Large = 1000
VeryLarge = 5000

[Modules.Housing.PlaceSizes.Town]
Small = 5000
Medium = 20000
Larger = 50000
Large = 100000
VeryLarge = 200000
Metropolis = 250000

# Nearby places of each place; changes apply after the next ImportPlaces run.
# The metropolis tier uses PlaceSizes.Town.Metropolis.
[Modules.Housing.Places]
BigCityMinPopulation = 100000   # a town this big is a big city
BigCityCount = 3                # big cities around a place: at most this many...
BigCityMaxKm = 50               # ...at most this far

# Monthly cost = price + admin rent: the rent field, else the description, else a 0 or 1 zł field as no rent, else an
# estimate from offers nearby and from the most local groups of offers (RentEstimator in the code; values tested on the
# stored offers 2026-11-26).
[Modules.Housing.MonthlyCosts]
MinRentPerM2 = 1       # a stated rent below (e.g. 20 zł) or above (e.g. 132 876 zł) is implausible, and so is a rent equal to the price;
MaxRentPerM2 = 100     # real rents go from about 2 zł/m² (a small fee) to about 50 zł/m² (luxury apartments, small studios)
NominalRentBelow = 10  # 0 or 1 zł typed because the form requires a value
Neighbors = 10         # the nearest offers of the same building type an estimate looks at...
NeighborRadiusKm = 2   # ...at most this far
WiderAreaWeight = 10   # how many offers the wider area's rate counts as next to the neighbors
WiderGroupWeight = 20  # how many offers a wider group's rate counts as next to a more local group (country -> neighborhood)
TypicalAreaM2 = 46     # the rate is multiplied by (area / TypicalAreaM2) ^ AreaExponent:
AreaExponent = -0.18   # small flats pay more per m², big ones less

# ImportPlaces and LinkPlaces have no schedule: they run from the buttons in the UI, e.g. after a new census
# (ImportPlaces), then LinkPlaces so stored offers get the new places.

[Modules.Housing.Jobs.ImportOffers]
Every = "00:10:00"

[Modules.Housing.Jobs.FetchDetails]
Every = "01:00:00"

[Modules.Housing.Jobs.ScanOffers]
DailyAt = "01:00"   # 33 minutes alone at 3-6 s between requests (expected about 30 at 2-5 s), longer while FetchDetails shares the portal; done before the backup at 03:00

# Saved offers get their cost at once from the stored rent rates; this calculates the rates again from all offers.
[Modules.Housing.Jobs.CalculateMonthlyCosts]
DailyAt = "02:00"   # after the full scan at 01:00

[Modules.Housing.Jobs.RawCaptureRetention]
DailyAt = "04:00"   # after the database backup at 03:00

[Jobs]
TimeZone = "Europe/Warsaw"

[Scraping]
RequireVpn = true
VpnInterfacePrefixes = "wg,tun,proton"
# Pause between two requests to one host, random in this range; no 429 from Otodom seen at 3-6 s.
MinDelaySeconds = 2
MaxDelaySeconds = 5
TimeoutSeconds = 30
RobotsCacheHours = 24

[Modules.JobOffers]
Enabled = false
