[Serilog.MinimumLevel]
Default = "Information"

[Serilog.MinimumLevel.Override]
"Microsoft.AspNetCore" = "Warning"
"System.Net.Http.HttpClient" = "Warning"
"Npgsql" = "Warning"   # otherwise every SQL command is logged

[Modules.Housing]
Enabled = true

# ----- Jobs: each job's schedule, time limit and own settings -----

# New offers during the day: the listing from the newest offer while its pages show new ones, then the detail pages
# of new and changed offers (newest first), then the monthly costs and statistics exclusions of all offers.
[Modules.Housing.Jobs.ImportNewOffers]
Every = "00:10:00"
From = "06:00"           # runs only from From until Until (Europe/Warsaw); "00:00" is midnight
Until = "00:00"
TimeLimit = "00:30:00"   # then the run takes no more detail pages; a longer run skips the next turns
MaxPages = 5             # 72 offers per page; more new offers are left to SyncAllOffers

# The whole portal at night: every listing page (360 in November 2026, about 33 minutes at 2-5 s between requests),
# offers missing from two runs in a row marked removed, then the detail pages of changed offers, then the derived data.
# Done before the database backup at 03:00 in a normal night.
[Modules.Housing.Jobs.SyncAllOffers]
DailyAt = "01:00"
TimeLimit = "04:00:00"   # ends before the first ImportNewOffers at 06:00
MaxPages = 1000          # safety limit only; a run stopped by it marks no offer removed

[Modules.Housing.Jobs.RawCaptureRetention]
DailyAt = "04:00"        # after the database backup at 03:00
RetentionDays = 30

# Without a schedule (buttons in the UI): ReparseOffers; ImportPlaces after a new census, then LinkPlaces so stored offers
# get the new places; RecalculateDerivedData after the rules below changed (every collecting run ends with it anyway).

# ----- The portal -----

[Modules.Housing.OtoDom]
BaseUrl = "https://www.otodom.pl"
ListingUrl = "https://www.otodom.pl/pl/wyniki/wynajem/mieszkanie/cala-polska?by=LATEST&direction=DESC&limit=72"

# How both collecting jobs fetch detail pages (about 4.2 s each at 2-5 s between requests).
[Modules.Housing.DetailPages]
MaxFailedAttempts = 3    # then the offer waits until its content changes or RetryAfterHours pass
RetryAfterHours = 24     # one more attempt per day: the portal may answer 404 or 410 only for a while
Retries = 4              # when the portal is out of reach (timeout, network, VPN; not 429): wait 30 s, 1, 2, 4 min
FirstRetrySeconds = 30

# Stored pages; Path is set per environment (bastion.<Environment>.toml).
[Modules.Housing.RawCaptures]
AnonymizationMask = "***"

# ----- Places (ImportPlaces) -----

[Modules.Housing.Wikidata]
QueryUrl = "https://query.wikidata.org/sparql"
UserAgent = "Bastion/1.0"
TimeoutSeconds = 180

# The smallest population of each place size; villages and towns have their own scales.
# Below Village.Medium a village is small; below Town.Small a town is very small.
[Modules.Housing.PlaceSizes.Village]
Medium = 200
Large = 1000
VeryLarge = 5000

[Modules.Housing.PlaceSizes.Town]
Small = 5000
Medium = 20000
Larger = 50000
Large = 100000
VeryLarge = 200000
Metropolis = 250000

# Nearby places of each place; changes apply after the next ImportPlaces run.
# The metropolis tier uses PlaceSizes.Town.Metropolis.
[Modules.Housing.Places]
BigCityMinPopulation = 100000   # a town this big is a big city
BigCityCount = 3                # big cities around a place: at most this many...
BigCityMaxKm = 50               # ...at most this far

# ----- Rules of the derived data (the last step of every collecting run) -----

# Monthly cost = price + admin rent: the rent field, else the description, else a 0 or 1 zł field as no rent, else an
# estimate from offers nearby and from the most local groups of offers (RentEstimator in the code; values tested on the
# stored offers 2026-11-26).
[Modules.Housing.MonthlyCosts]
MinRentPerM2 = 1       # a stated rent below (e.g. 20 zł) or above (e.g. 132 876 zł) is implausible, and so is a rent equal to the price;
MaxRentPerM2 = 100     # real rents go from about 2 zł/m² (a small fee) to about 50 zł/m² (luxury apartments, small studios)
NominalRentBelow = 10  # 0 or 1 zł typed because the form requires a value
Neighbors = 10         # the nearest offers of the same building type an estimate looks at...
NeighborRadiusKm = 2   # ...at most this far
WiderAreaWeight = 10   # how many offers the wider area's rate counts as next to the neighbors
WiderGroupWeight = 20  # how many offers a wider group's rate counts as next to a more local group (country -> neighborhood)
TypicalAreaM2 = 46     # the rate is multiplied by (area / TypicalAreaM2) ^ AreaExponent:
AreaExponent = -0.18   # small flats pay more per m², big ones less

# Offers the statistics leave out (values chosen on the stored offers 2026-11-27, see StatisticsExclusionService).
[Modules.Housing.StatisticsExclusions]
FenceMultiplier = 3      # outside Q1 - 3 IQR .. Q3 + 3 IQR of ln(price per m²) in the offer's group: ~0.3% of offers, nearly all errors
MinGroupSize = 30        # a smaller group takes the next wider one (place -> size of place in the voivodeship -> in the country -> country)
MinPrice = 100           # a price below is a token amount (1 zł)...
MaxPricePerM2 = 1000     # ...and one above this per m² is a sale price
MinAreaM2 = 5            # an area below is a typo; so is one above LargeAreaM2 priced below the fences (4 216 m² for 1 350 zł)
LargeAreaM2 = 300
ParkingMaxAreaM2 = 20    # a title about a parking space is one only when the area or the price is this small;
ParkingMaxPrice = 700    # most such titles are flats with a parking space

# ----- Shared by all modules -----

[Jobs]
TimeZone = "Europe/Warsaw"

[Scraping]
RequireVpn = true
VpnInterfacePrefixes = "wg,tun,proton"
# Pause between two requests to one host, random in this range; no 429 from Otodom seen at 3-6 s.
MinDelaySeconds = 2
MaxDelaySeconds = 5
TimeoutSeconds = 30
RobotsCacheHours = 24

[Modules.JobOffers]
Enabled = false
