# Server override, used by bastion.service through deploy/compose.sh (secrets);
# scraping goes through the vpn container.
# No restart policies: systemd restarts the whole stack (see bastion.service). Docker restarting
# a single container would start it at boot before the secrets exist, and a restarted vpn
# would leave the app without network.
services:
  app:
    # Built and published by CI for every commit on master; BASTION_COMMIT is set by compose.sh.
    image: ghcr.io/maydev09/bastion:${BASTION_COMMIT:?run through deploy/compose.sh}
    # Shares the network of vpn, so all its traffic goes through the tunnel.
    network_mode: service:vpn
    secrets:
      - source: db_connection_string
        target: ConnectionStrings__Bastion
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
      vpn:
        condition: service_healthy

  vpn:
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      # Portals are Polish; a Polish exit IP looks like a normal visitor.
      SERVER_COUNTRIES: Poland
    secrets:
      - wireguard_private_key
    # The app has no network of its own; its UI is published here. IPv4 only: the home network
    # is behind the router's NAT, IPv6 has no NAT and Docker bypasses the host firewall.
    ports:
      - "0.0.0.0:8080:8080"

secrets:
  db_postgres_password: !override
    file: /run/bastion/db-postgres-password
  db_owner_password: !override
    file: /run/bastion/db-owner-password
  db_app_password: !override
    file: /run/bastion/db-app-password
  db_connection_string:
    file: /run/bastion/db-connection-string
  wireguard_private_key:
    file: /run/bastion/wireguard-private-key

volumes:
  app-data:
